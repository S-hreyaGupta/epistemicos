name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Alex Zamurko, 10 October 2026, on what independent execution evidence has
  # to be: "If Codex cannot execute, use a separate independent runner against
  # the exact frozen commit... provided the implementing agent does not control
  # that evidence."
  #
  # A push run is already tied to a commit and published by GitHub, which is
  # the substance of that. This adds the ability to aim it at a named commit
  # deliberately, so the evidence for a frozen review cycle can be produced
  # from the cycle's own target commit rather than from whatever happened to
  # be on main that day.
  workflow_dispatch:
    inputs:
      ref:
        description: "commit, tag or branch to run against (blank = this branch)"
        required: false
        default: ""
      sweep:
        description: "also run the full mutation sweep (slow, ~1-2 h)"
        type: boolean
        required: false
        default: false

jobs:
  go:
    name: vet + test + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: go vet
        run: go vet ./...

      # gofmt is a gate here, unlike in the predecessor repository where it
      # was never enforced and 25 files had accumulated drift. Starting clean
      # means it can stay clean.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -count=1

  # Until 17 September this workflow ran Go checks and nothing else, so the
  # execution layer — the review machinery itself, and every control over it —
  # was verified only when somebody remembered to type the command. 319 controls
  # that nothing ran on push.
  #
  # That is the shape this layer keeps finding in itself: a check that exists
  # and is not reached. It was invisible because the suites were run by hand
  # constantly during development, so they were always green and never
  # scheduled.
  execution-layer:
    name: review machinery — 319 controls + rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The suites resolve git commits and check that a referenced commit
          # exists. A shallow clone fails those for a reason that has nothing
          # to do with the code.
          fetch-depth: 0
          # Blank on a push, so it behaves exactly as before. Set by hand when
          # the evidence has to describe one particular frozen commit.
          ref: ${{ inputs.ref || github.sha }}

      # Printed where the run page shows it, because the whole value of this
      # evidence is that a reader can tell which bytes it describes without
      # taking anyone's word for it.
      - name: which commit this run describes
        run: |
          {
            echo "### commit under test"
            echo '```text'
            echo "requested  ${{ inputs.ref || '(push)' }}"
            echo "resolved   $(git rev-parse HEAD)"
            echo "subject    $(git log -1 --format=%s)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The job had no install step from the day it was written, so python-docx
      # was missing, test_convert_protocol.py raised SystemExit(2) at import,
      # and the job stopped at step 7 of 16. It was never green, and the nine
      # steps after it had never run on any commit.
      - name: dependencies
        run: pip install -r requirements-ci.txt

      # Recorded on the run page, because it is the thing local runs cannot
      # tell you. Twelve consecutive failures were undiagnosable from outside
      # partly because nobody could see what the runner's environment was.
      - name: environment, on the run page
        run: |
          {
            echo "### environment"
            echo '```text'
            echo "python     $(python -V 2>&1)   at $(command -v python)"
            echo "commit     $(git rev-parse HEAD)"
            echo "cwd        $(pwd)"
            echo "scripts    $(ls scripts/*.py 2>/dev/null | wc -l) python files present"
            echo "data/      $(ls data 2>/dev/null | wc -l) entries"
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # Each suite separately, so a failure names which one rather than
      # stopping at the first and leaving the rest unknown. Through
      # ci-step.sh, so a failure is legible on the run page without a
      # GitHub account — see the header of that file.
      #
      # `if: !cancelled()` because separate steps alone did not deliver what
      # the sentence above claims. GitHub stops a job at its first failed
      # step, so one missing dependency in step 7 meant the nine steps after
      # it had never run on any commit — the rest were left unknown exactly as
      # described, by a workflow whose comment said otherwise. Now every suite
      # reports, and the job still fails if any of them do.
      - name: MC-2 conformance gate
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "test_validate_cycle" python scripts/test_validate_cycle.py

      - name: review runner
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "test_run_review" python scripts/test_run_review.py

      - name: finding ledger and loop controller
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "test_ledger" python scripts/test_ledger.py

      - name: bootstrap gate
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "test_bootstrap_gate" python scripts/test_bootstrap_gate.py

      - name: component seams
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "test_interfaces" python scripts/test_interfaces.py

      - name: prompts agree with the protocol
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "test_prompts" python scripts/test_prompts.py

      - name: protocol conversion and pinning
        if: ${{ !cancelled() }}
        run: |
          bash .github/ci-step.sh "test_convert_protocol" python scripts/test_convert_protocol.py
          bash .github/ci-step.sh "test_protocol_pin" python scripts/test_protocol_pin.py

      # Outside the reviewed target, so outside the 319, and run here for the
      # same reason: a control nobody runs is not a control.
      - name: section 7 approval package
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "test_approval_package" python scripts/test_approval_package.py

      # Added 10 October. It was written on 7 October and has never run here,
      # which is the same gap this job was created to close: a suite that
      # exists and nothing reaches. It is also the suite that proves the
      # testing tool leaves the repository untouched when it is killed, which
      # is Alex Zamurko's first required action, so having it verified only on
      # the implementing agent's own machine was the wrong place for it.
      - name: the testing tool cannot damage the repository
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "test_probe_recovery" python scripts/test_probe_recovery.py

      - name: section 15 gold runner
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "test_gold_runner" python scripts/test_gold_runner.py

      - name: citation candidate adapter
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "test_citation_candidate" python scripts/test_citation_candidate.py

      - name: citation extractor conformance
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "test_citation_extract" python scripts/test_citation_extract.py

      # The suite above is the only evidence that the rebuilt extractor follows
      # v3.3, and on the day it was written it passed with two of the spec's
      # rules broken: the six-token C2 cap removed, and author_phrase cut at the
      # first comma. Both were found by mutating the implementation, neither by
      # a control going red.
      #
      # So this runs the mutation probe as well. It is the check on the check —
      # a control that cannot fail is not a control, and this suite has already
      # contained two of those. Half a second.
      # rc2's own conformance matrix, 86 cases. Fails if a probe goes stale,
      # because a coverage map that silently stops measuring is worse than
      # none — it reports the same number while checking less.
      - name: rc2 conformance coverage
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "rc2_conformance_map" python scripts/rc2_conformance_map.py

      # The consolidation documents describe two review candidates that are
      # not frozen. If either moves, the section comparison they rest on has
      # to be re-run rather than trusted.
      - name: rc1/rc2 section comparison
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "rc1_rc2_section_diff" python scripts/rc1_rc2_section_diff.py

      # Every corpus number quoted anywhere comes from here, under ce.FIXES.
      # Added 22 September after a measurement using two of the five fixes
      # reported 72 uncited references where the figure is 57, and disagreed
      # with the parsed count already on record without that being noticed.
      # Fails if the figures move, so a change has to be explained rather than
      # absorbed.
      - name: citation corpus figures
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "corpus_report" python scripts/corpus_report.py

      - name: citation controls can actually fail
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "mutate_citation_suite" python scripts/mutate_citation_suite.py

      # The suites ask whether each component refuses what it should. This asks
      # whether they still compose. It is the only check here that would catch
      # two components drifting apart while both remain individually correct.
      - name: full protocol rehearsal
        if: ${{ !cancelled() }}
        run: bash .github/ci-step.sh "dry_run" python scripts/dry_run.py

      # The count the bootstrap prompts state is checked against the suites by
      # test_prompts above. This asserts the tool that produces it still exits
      # cleanly, without letting it write: a refresh that rewrote a prompt in
      # CI would be an unreviewed edit to a frozen document.
      - name: control counts are computable
        if: ${{ !cancelled() }}
        run: |
          bash .github/ci-step.sh "refresh_counts" python scripts/refresh_counts.py
          git diff --exit-code -- specs/prompts/ || {
            echo "refresh_counts.py modified a prompt during CI."
            echo "A finished cycle's prompt states the controls that existed"
            echo "when it ran, and CI must not be what changes that."
            exit 1
          }

      # The same hazard, one directory over, and it was live until 18 September.
      # The guard above existed for specs/prompts and there was none for runs/,
      # so test_approval_package.py regenerated a finished review's committed
      # APPROVAL-PACKAGE.md on every run — invisibly here, because the checkout
      # is discarded, and locally as a dirty tree someone could commit without
      # reading.
      #
      # This is last deliberately. It asks whether anything above wrote into the
      # record, so it has to run after all of them.
      - name: no suite wrote into a recorded run
        if: ${{ !cancelled() }}
        run: |
          git diff --exit-code -- runs/ || {
            echo ""
            echo "A step above modified a file under runs/."
            echo "Cycles, ledgers and packages are the record a human decides"
            echo "from. A suite may read them and must not rewrite them; if a"
            echo "tool needs to produce one, give it --out."
            exit 1
          }

  # The mutation sweep, run by GitHub rather than by the implementing agent.
  #
  # EC-2 claims every repair goes red when removed, and until now the only
  # evidence for that was a log produced on the machine of the person whose
  # repairs they are. Alex Zamurko's condition for independent execution
  # evidence is that the implementing agent does not control it. This is the
  # cheapest honest version: GitHub checks out the commit, runs the sweep, and
  # publishes the output on a page nobody here can edit.
  #
  # What it establishes and what it does not, stated so the tick is not read
  # for more than it covers. It establishes that the sweep ran on that exact
  # commit and what it reported. It does not establish that the mutations are
  # the right mutations or that the controls are good controls, because the
  # implementing agent wrote both. That half is a reviewer reading the sources.
  #
  # Not on push: it takes one to two hours and would make every commit wait.
  # Run it deliberately, against a frozen cycle's target commit, which is when
  # the evidence is actually needed.
  mutation-sweep:
    name: every repair goes red when removed
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sweep }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: dependencies
        run: pip install -r requirements-ci.txt

      # The probe makes git worktrees, and git refuses to do that without an
      # identity configured. On a runner there is none.
      - name: git identity for the worktrees
        run: |
          git config user.email "ci@epistemicos.invalid"
          git config user.name "ci"

      # -u so the log is readable as it goes rather than arriving in blocks at
      # the end, which cost an afternoon locally on 10 October.
      - name: full mutation sweep
        run: python -u _probe/mutate_repairs.py | tee sweep.txt

      - name: the result, on the run page
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### mutation sweep"
            echo "commit \`$(git rev-parse HEAD)\`"
            echo '```text'
            tail -n 20 sweep.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Kept as a downloadable file, because a sweep is the evidence a frozen
      # cycle cites and a run page is not forever.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mutation-sweep-${{ github.sha }}
          path: sweep.txt

      - name: the repository is untouched
        if: ${{ !cancelled() }}
        run: |
          git diff --exit-code || {
            echo "The sweep changed tracked files. It writes only to a"
            echo "disposable checkout, so this means the isolation failed."
            exit 1
          }

  docker:
    name: docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build api image
        run: docker build -f deploy/Dockerfile.api -t epistemicos-api:ci .
