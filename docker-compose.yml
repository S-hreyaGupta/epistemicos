services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paperly
      POSTGRES_USER: paperly
      POSTGRES_PASSWORD: paperly
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperly -d paperly"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    ports:
      - "9082:9082"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAPERLY_DB_URL: postgres://paperly:paperly@postgres:5432/paperly?sslmode=disable
      PAPERLY_LISTEN_ADDR: ":9082"
      PAPERLY_PDF_VOLUME: /data/pdfs
      PAPERLY_CORS_ALLOWED_ORIGINS: ${PAPERLY_CORS_ALLOWED_ORIGINS:-*}
      PAPERLY_RATE_LIMIT_RPM: ${PAPERLY_RATE_LIMIT_RPM:-60}
      PAPERLY_RATE_LIMIT_BURST: ${PAPERLY_RATE_LIMIT_BURST:-20}
      MATHPIX_APP_ID: ${MATHPIX_APP_ID:-}
      MATHPIX_APP_KEY: ${MATHPIX_APP_KEY:-}
    volumes:
      - pdf_data:/data/pdfs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9082/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg_data:
  pdf_data:
