services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: epistemicos
      POSTGRES_USER: epistemicos
      POSTGRES_PASSWORD: epistemicos
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epistemicos -d epistemicos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    ports:
      - "9082:9082"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EPISTEMIC_OS_DB_URL: postgres://epistemicos:epistemicos@postgres:5432/epistemicos?sslmode=disable
      EPISTEMIC_OS_LISTEN_ADDR: ":9082"
      EPISTEMIC_OS_PDF_VOLUME: /data/pdfs
      EPISTEMIC_OS_CORS_ALLOWED_ORIGINS: ${EPISTEMIC_OS_CORS_ALLOWED_ORIGINS:-*}
      EPISTEMIC_OS_RATE_LIMIT_RPM: ${EPISTEMIC_OS_RATE_LIMIT_RPM:-60}
      EPISTEMIC_OS_RATE_LIMIT_BURST: ${EPISTEMIC_OS_RATE_LIMIT_BURST:-20}
      MATHPIX_APP_ID: ${MATHPIX_APP_ID:-}
      MATHPIX_APP_KEY: ${MATHPIX_APP_KEY:-}
    volumes:
      - pdf_data:/data/pdfs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9082/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg_data:
  pdf_data:
