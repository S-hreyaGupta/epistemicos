name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: vet + test + fmt
    runs-on: ubuntu-latest

    # The 38 store and approved tests connect to a real Postgres. Without this
    # service they skip, and `go test` reports ok for a suite that tested
    # nothing. Image and credentials match docker-compose.yml so a failure here
    # reproduces locally with `make up`.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: epistemicos
          POSTGRES_USER: epistemicos
          POSTGRES_PASSWORD: epistemicos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epistemicos -d epistemicos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # Host is localhost, not the service name: this job runs directly on the
      # runner, so the service reaches it through the mapped port.
      EPISTEMIC_OS_DB_URL: postgres://epistemicos:epistemicos@localhost:5432/epistemicos?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      # make gate is the single gate definition: vet, gofmt (enforced here,
      # unlike the predecessor repository where it was never enforced and 25
      # files had accumulated drift), build, env-preflight, migrate and test,
      # in that order. Migrations are applied by the gate's own `$(MAKE)
      # migrate` invocation now — the store tests assume the schema already
      # exists and a missing table would otherwise surface as a query error
      # rather than a skip — so no step exists here that `make gate` does not
      # have.
      - name: make gate
        run: make gate

  docker:
    name: docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build api image
        run: docker build -f deploy/Dockerfile.api -t epistemicos-api:ci .
